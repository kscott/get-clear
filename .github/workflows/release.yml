name: Build and Release PKG

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_NOTES: >-
    Installs Get Clear.app and its six commands (get-clear, reminders, calendar, contacts, mail, text).
    Double-click get-clear.pkg to install. Already installed? Run get-clear update.

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: swift test

  build:
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Setup keychain
        env:
          APP_P12_DATA: ${{ secrets.DEVELOPER_ID_P12 }}
          APP_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          INSTALLER_P12_DATA: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p "" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          echo "$APP_P12_DATA" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k $KEYCHAIN -P "$APP_P12_PASSWORD" -T /usr/bin/codesign
          rm /tmp/app.p12
          echo "$INSTALLER_P12_DATA" | base64 --decode > /tmp/installer.p12
          security import /tmp/installer.p12 -k $KEYCHAIN -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/productsign
          rm /tmp/installer.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN

      - name: Build and sign Get Clear.app
        run: ./scripts/build-app

      - name: Notarize and staple the app
        env:
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: |
          ditto -c -k --keepParent ".build/Get Clear.app" app-notarize.zip
          xcrun notarytool submit app-notarize.zip \
            --apple-id "$NOTARYTOOL_APPLE_ID" \
            --password "$NOTARYTOOL_PASSWORD" \
            --team-id "$NOTARYTOOL_TEAM_ID" \
            --wait
          xcrun stapler staple ".build/Get Clear.app"
          # The self-update asset: the stapled app, zipped (spec 018 R8).
          ditto -c -k --keepParent ".build/Get Clear.app" Get-Clear.zip

      - name: Build the installer package
        run: ./scripts/build-pkg

      - name: Sign package
        run: |
          productsign \
            --sign "Developer ID Installer: Kenneth Scott (6Q96Q79QN8)" \
            get-clear-unsigned.pkg \
            get-clear.pkg

      - name: Notarize and staple
        env:
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: |
          xcrun notarytool submit get-clear.pkg \
            --apple-id "$NOTARYTOOL_APPLE_ID" \
            --password "$NOTARYTOOL_PASSWORD" \
            --team-id "$NOTARYTOOL_TEAM_ID" \
            --wait
          xcrun stapler staple get-clear.pkg

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release edit "v$VERSION" \
              --title "Get Clear $VERSION" \
              --notes "$RELEASE_NOTES" \
              --latest
            gh release upload "v$VERSION" get-clear.pkg Get-Clear.zip --clobber
          else
            gh release create "v$VERSION" get-clear.pkg Get-Clear.zip \
              --title "Get Clear $VERSION" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest get-clear.pkg Get-Clear.zip --clobber
          gh release edit latest \
            --title "Get Clear $VERSION" \
            --notes "$RELEASE_NOTES"

  smoke-test:
    runs-on: macos-latest
    needs: build

    steps:
      - name: Download PKG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest \
            --repo kscott/get-clear \
            --pattern "get-clear.pkg" \
            --output get-clear.pkg

      - name: Install PKG
        run: sudo installer -pkg get-clear.pkg -target /

      - name: Smoke test — app and links
        run: |
          codesign --verify --deep --strict "/Applications/Get Clear.app"
          spctl -a -vv "/Applications/Get Clear.app"
          for tool in get-clear reminders calendar contacts mail text; do
            target=$(readlink "/usr/local/bin/$tool")
            [[ "$target" == "/Applications/Get Clear.app/Contents/Helpers/$tool" ]] \
              || { echo "/usr/local/bin/$tool -> '$target', expected a link into the app"; exit 1; }
          done

      - name: Smoke test — version flags
        run: |
          get-clear --version
          reminders --version
          calendar --version
          contacts --version
          mail --version
          text --version

      - name: Smoke test — basic commands
        run: |
          get-clear help
          reminders help
          calendar help
          contacts help
          mail help
          text help
